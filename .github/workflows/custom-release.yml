name: Custom release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'cybito/beads_viewer' && !github.event.release.draft
    runs-on: ubuntu-24.04-arm
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch authoritative custom ref
        run: git fetch --no-tags origin refs/heads/custom:refs/remotes/origin/custom
      - name: Exercise release and asset boundary regressions
        run: bash .github/scripts/custom-release.sh validation-regressions
      - name: Validate release tag ancestry and version
        id: validate
        run: bash .github/scripts/custom-release.sh validate-release
  build:
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            runner: macos-26
          - platform: linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    concurrency:
      group: custom-release-${{ github.repository }}-${{ needs.validate.outputs.tag }}-${{ matrix.platform }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      SOURCE_SHA: ${{ needs.validate.outputs.sha }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check and download existing platform assets
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/package-release.py check --tag "$RELEASE_TAG" --commit "$SOURCE_SHA" --platform "$PLATFORM" --output-dir "$RUNNER_TEMP/existing" > "$RUNNER_TEMP/existing.json"
          python3 - <<'PY'
          import json, os
          result = json.load(open(os.environ['RUNNER_TEMP'] + '/existing.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('exists=' + str(result['exists']).lower() + '\n')
          if result['exists']:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('Verified and downloaded existing Release assets: ' + ', '.join('`' + n + '`' for n in result['assets']) + '\n')
          PY
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: steps.existing.outputs.exists != 'true'
        with:
          go-version: '1.26.8'
          cache: false
      - name: Build native bv and robot dependency smoke
        if: steps.existing.outputs.exists != 'true'
        run: bash .github/scripts/custom-release.sh build "$PLATFORM" "$RELEASE_TAG" "$SOURCE_SHA" "$RUNNER_TEMP/payload"
      - name: Pack archive and smoke explicit-prefix installation
        if: steps.existing.outputs.exists != 'true'
        env:
          BV_NO_BROWSER: '1'
          BV_TEST_MODE: '1'
          BV_NO_SAVED_CONFIG: '1'
          BV_NO_UPDATE_CHECK: '1'
        run: |
          set -euo pipefail
          python3 .github/scripts/package-release.py pack --tag "$RELEASE_TAG" --commit "$SOURCE_SHA" --platform "$PLATFORM" --input-dir "$RUNNER_TEMP/payload" --output-dir "$RUNNER_TEMP/package"
          mkdir -p "$RUNNER_TEMP/archive-smoke" "$RUNNER_TEMP/archive-home"
          tar -xzf "$RUNNER_TEMP/package/bv-$RELEASE_TAG-$PLATFORM-arm64.tar.gz" -C "$RUNNER_TEMP/archive-smoke"
          "$RUNNER_TEMP/archive-smoke/install.sh" --prefix "$RUNNER_TEMP/archive-prefix"
          "$RUNNER_TEMP/archive-smoke/install.sh" --prefix "$RUNNER_TEMP/archive-prefix"
          test "$(HOME="$RUNNER_TEMP/archive-home" "$RUNNER_TEMP/archive-prefix/bin/bv" --version)" = "bv $RELEASE_TAG"
      - name: Upload missing immutable Release assets and read back
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/package-release.py publish --directory "$RUNNER_TEMP/package" > "$RUNNER_TEMP/published.json"
          python3 - <<'PY'
          import json, os
          result = json.load(open(os.environ['RUNNER_TEMP'] + '/published.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Uploaded/read-back verified Release assets: ' + ', '.join('`' + n + '`' for n in result['assets']) + '\n')
          PY
  summarize:
    needs: [validate, build]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    concurrency:
      group: custom-release-notes-${{ github.repository }}-${{ needs.validate.outputs.tag }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      SOURCE_SHA: ${{ needs.validate.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - name: Verify downloaded assets for both platforms
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for platform in darwin linux; do
            python3 .github/scripts/package-release.py check --tag "$RELEASE_TAG" --commit "$SOURCE_SHA" --platform "$platform" --output-dir "$RUNNER_TEMP/verified-$platform" > "$RUNNER_TEMP/result-$platform.json"
          done
      - name: Update only managed release notes block
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          tag, sha = os.environ['RELEASE_TAG'], os.environ['SOURCE_SHA']
          api = 'repos/cybito/beads_viewer/releases/tags/' + tag
          release = json.loads(subprocess.check_output(['gh', 'api', api]))
          rows = []
          for platform in ('darwin', 'linux'):
              result = json.load(open(os.environ['RUNNER_TEMP'] + '/result-' + platform + '.json'))
              if not result['exists']:
                  raise SystemExit('missing platform assets')
              rows.append((platform, result['assets']))
          start, end = '<!-- custom-builds:start -->', '<!-- custom-builds:end -->'
          block = start + '\n## Custom ARM64 builds\n\nSource: [`' + sha + '`](https://github.com/cybito/beads_viewer/commit/' + sha + ')\n\nRelease: [`' + tag + '`](https://github.com/cybito/beads_viewer/releases/tag/' + tag + ')\n\n'
          for platform, names in rows:
              block += '- **' + platform + '/arm64**:\n'
              for name in names:
                  block += '  - [Download ' + name + '](https://github.com/cybito/beads_viewer/releases/download/' + tag + '/' + name + ')\n'
              block += '\n  After downloading all three files, strip the `' + tag + '-' + platform + '-` filename prefix to restore package names, then verify with `sha256sum -c SHA256SUMS` (macOS: `shasum -a 256 -c SHA256SUMS`).\n\n'
          block += end
          body = release.get('body') or ''
          if body.count(start) != body.count(end) or body.count(start) > 1:
              raise SystemExit('ambiguous managed notes markers')
          if start in body:
              if body.index(start) > body.index(end): raise SystemExit('reversed managed notes markers')
              body = re.sub(re.escape(start) + r'.*?' + re.escape(end), lambda _: block, body, flags=re.S)
          else:
              body = body.rstrip() + '\n\n' + block
          subprocess.run(['gh', 'api', '--method', 'PATCH', 'repos/cybito/beads_viewer/releases/' + str(release['id']), '--input', '-'], input=json.dumps({'body':body}).encode(), check=True)
          PY
